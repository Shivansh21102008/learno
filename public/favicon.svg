<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="60%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    
    <!-- Inner Glow Gradient -->
    <linearGradient id="innerGlow" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Golden Intellect Spark Gradient -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base with Drop Shadow -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#innerGlow)" stroke-width="1.5"/>

  <!-- Logo Graphics Group -->
  <g filter="url(#dropShadow)">
    <!-- Open Book Pages (Wings of Knowledge) -->
    <path d="M12 44C18 41.5 26 42.5 32 46C38 42.5 46 41.5 52 44V20C46 17.5 38 18.5 32 22C26 18.5 18 17.5 12 20V44Z" 
          fill="#FFFFFF" fill-opacity="0.95"/>
    
    <!-- Book Center Spine Divider -->
    <path d="M32 22V46" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>

    <!-- Academic Mortarboard (Graduation Cap Diamond) -->
    <path d="M32 10L10 20L32 30L54 20L32 10Z" fill="#0F172A" stroke="#F8FAFC" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- Mortarboard Headband Base -->
    <path d="M19 25V32C19 36 24.5 39 32 39C39.5 39 45 36 45 32V25" fill="#1E293B" stroke="#F8FAFC" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Golden Tassel -->
    <path d="M48 20.5V30M48 30L50.5 32M48 30L45.5 32" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Golden Intellect Star Spark in Center -->
    <path d="M32 15V22M28.5 18.5H35.5" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="32" cy="18.5" r="1.8" fill="#FDE047"/>
  </g>

  <!-- Ambient Intellect Corner Sparkle Badge -->
  <circle cx="53" cy="11" r="4.5" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5"/>
  <path d="M53 8.5V13.5M50.5 11H55.5" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>
</svg>